<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North Star Bakery</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 0;
background-color: #fcf8f2;
color: #333;
text-align: center;
}
header {
background-color: #d97736;
color: white;
padding: 2rem;
}
main {
padding: 2rem;
}
footer {
margin-top: 2rem;
padding: 1rem;
background-color: #333;
color: white;
}
</style>
</head>
<body>
<header>
<h1>North Star Bakery</h1>
<p>Freshly baked goods every single day!</p>
</header>
<main>
<h2>Welcome to Our Bakery</h2>
<p>We specialize in artisanal breads, pastries, and custom cakes.</p>
</main>
<footer>
<p>&copy; 2026 North Star Bakery</p>
</footer>

</html>
<!-- Interactive Favorite Feature Section -->
<section style="padding: 20px; text-align: center;">
<h2>Our Bakery Specials</h2>
<p id="favorite-display">No favorite selected yet.</p>
<button class="favorite-btn" data-item="Signature Loaf">Save Signature Loaf as Favorite</button>
<button class="favorite-btn" data-item="Artisan Pastry">Save Artisan Pastry as Favorite</button>
</section>

<!-- Form Validation Section -->
<section style="padding: 20px; text-align: center;">
<h2>Pre-Order & Contact Us</h2>
<form id="contact-form">
<label for="email">Email Address:</label>
<input type="text" id="email" name="email" placeholder="enter email">
<button type="submit">Submit Pre-Order</button>
<p id="email-error"></p>
</form>
</section>

<!-- Link to external JavaScript file -->
<script src="script.js"></script>
